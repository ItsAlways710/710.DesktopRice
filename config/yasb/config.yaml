# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json
# For more information, visit https://github.com/amnweb/yasb/wiki
# watch_config stays FALSE on purpose (confirmed from YASB's own source,
# core/bar_manager.py: on_config_modified): a config.yaml change on disk triggers a full
# reload_application() process restart, which is the path that produced the "connects
# fine, never renders, CPU creeps up" komorebi-pipe-subscription bug we spent a night
# chasing (ported this off from winarchy's own config, which documents the same issue).
# watch_stylesheet is safe and back ON: confirmed from source (core/watcher.py /
# on_styles_modified) that a stylesheet change -- including an imported file like
# wallust_colors.css -- only calls bar.setStyleSheet() on the already-built bars. It
# never touches widgets, listeners, or komorebi at all, so it can't reintroduce the
# widget bug. This is what makes wallpaper-driven color changes show up on the YASB bar
# live again, without needing a manual reload.
watch_stylesheet: true
watch_config: false
system_colors: false
debug: false
update_check: true
bars:
  primary-bar:
    enabled: true
    style: "adaptive"
    style_adaptive_exclude: ["wallpapers", "systray"]
    screens:
    - '*'
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: false
      round_corners: true
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 35
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - home
      - lines
      - komorebi_active_layout
      - lines
      - komorebi_workspaces
      - lines
      - active_window
      center:
      - clock
      - weather
      right:
      - systray
      - lines
      - systeminfo-grouper
      - lines
      - wallpapers
      - lines
      - notifications
      - control_center
widgets:
  home:
    type: yasb.home.HomeWidget
    options:
      label: "<span>家</span>"
      menu_list:
      - title: User Home
        path: '~'
      - title: Download
        path: ~\Downloads
      - title: Documents
        path: ~\Documents
      - title: Pictures
        path: ~\Pictures
      - title: Wallpapers
        path: D:\OneDrive\Pictures\Wallpapers\Themes
      system_menu: true
      power_menu: false
      blur: false
      round_corners: true
      round_corners_type: normal
      border_color: System
      alignment: left
      offset_left: -5
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%a, %d %b %H:%M}<span>{alarm}</span>'
      label_alt: '{%a, %d %b %H:%M}'
      timezones: []
      calendar:
        blur: false
        round_corners: true
        alignment: center
        offset_left: 110
        direction: down
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "<span>\udb80\udc9e</span>"
      label_alt: '{count} notifications'
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: toggle_notification
        on_right: do_nothing
        on_middle: do_nothing
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: "<span>\udb80\udc09</span>"
      uptime: true
      show_user: true
      menu_style: popup
      popup:
        blur: false
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        offset_left: 12
      profile_image_size: 64
      buttons:
        lock:
        - "\uDB80\uDF41"
        - Lock
        signout:
        - "\uDB80\uDF43"
        - Sign out
        sleep:
        - "\uDB82\uDD04"
        - Sleep
        hibernate:
        - "\uDB82\uDD01"
        - Hibernate
        restart:
        - "\uDB81\uDC53"
        - Restart
        shutdown:
        - "\uDB82\uDD06"
        - Shut Down
        cancel:
        - ''
        - Cancel
  active_window:
    type: yasb.active_window.ActiveWindowWidget
    options:
      label: '{win[title]}'
      label_alt: '{win[title]}'
      label_no_window: ''
      label_icon: true
      label_icon_size: 16
      max_length: 32
      max_length_ellipsis: '...'
      monitor_exclusive: false
  lines:
    type: "yasb.custom.CustomWidget"
    options:
      label: "\u007c"
      label_alt: "\u007c"
      class_name: "separator-widget"
      callbacks:
        on_left: "do_nothing"
  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "Komorebi Offline"
      label_workspace_btn: "{index}"
      label_workspace_active_btn: "{index}"
      label_workspace_populated_btn: "{index}"
      label_default_name: ""
      label_zero_index: false
      # false, matching winarchy's own config: true hides every workspace button
      # except whichever one currently has focus on that specific monitor -- which
      # explains "connects fine, shows nothing" on a secondary monitor whose
      # workspace isn't the globally-focused one, and loses the multi-workspace
      # view on the extra monitor entirely.
      hide_empty_workspaces: false
      hide_if_offline: true
      toggle_workspace_layer:
        enabled: false
        tiling_label: "Tiling"
        floating_label: "Floating"
      app_icons: 
        enabled_populated: false
        enabled_active: false
        size: 12
        max_icons: 0
        hide_label: false
        hide_duplicates: false
        hide_floating: false
  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "{layout_name}"
      layouts: ['bsp', 'columns', 'rows', 'grid', 'scrolling', 'vertical_stack', 'horizontal_stack', 'ultrawide_vertical_stack','right_main_vertical_stack']
      layout_icons:
        bsp: "\uebeb"
        columns: "\uebf7"
        rows: "\uec01"
        grid: "\udb81\udf58"
        scrolling: "\uebf7"
        vertical_stack: "\uebee"
        horizontal_stack: "\uebf0"
        ultrawide_vertical_stack: "\uebee"
        right_main_vertical_stack: "\uebf1"
        monocle: "\uf06f"
        maximized: "\uf06f"
        floating: "\uf2d2"
        paused: "\udb83\udf89"
        tiling: "\udb81\ude40"
      callbacks:
        on_left: 'toggle_layout_menu'
        on_middle: 'next_layout'
        on_right: 'prev_layout'
      layout_menu:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "left"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_layout_icons: true
  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "\uf107"
      label_expanded: "\uf106"
      label_position: "left" # Can be "left" or "right"
      icon_size: 16 # Can be any integer between 8 and 64
      pin_click_modifier: "alt" # Can be "ctrl", "alt" or "shift"
      show_unpinned: false
      show_unpinned_button: true
      show_battery: false
      show_in_popup: 1
      show_volume: false
      icons_per_row: 3
      # show_network / use_hook used to be listed twice here with conflicting values
      # (true then false for both) -- a genuine duplicate-key typo, not an intentional
      # override. YAML's last-key-wins meant `false` was already what actually applied;
      # this just removes the dead duplicate rather than changing behavior. false matches
      # the show_battery/show_volume/show_unpinned pattern above (native icon categories
      # off, surfaced elsewhere in the bar instead) -- and separately, this repo skips
      # winarchy's net-icon autostart component (a different mechanism entirely; see
      # claude/winarchy-decoupling-plan.md), so there's currently no network status shown
      # either way regardless of this toggle.
      show_network: false
      use_hook: false # Whether to use the new systray hook instead of the legacy systray monitor
      hide_icons: [] # Optional, list of process names to hide (e.g. ["discord"])
      popup:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: None
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span>\udb83\udc8d</span>"
      change_automatically: false
    # Scans both folders (and their subfolders) for wallpapers: the repo's own
    # small tracked default set, and a separate, untracked personal collection
    # that never touches git -- see claude/winarchy-decoupling-plan.md,
    # Wallpapers section.
      image_path:
        - "C:\\710.DesktopRice\\assets\\wallpapers"
        - "C:\\Users\\USERNAME\\Pictures\\wallpapers"
      engine:
        # Disabled -- YASB's WallpaperEngine crossfade transition has a real,
        # reproducible bug: it crashes the whole YASB process some time after
        # a wallpaper switch (AttributeError: no attribute '_progress' in
        # paintEvent, or a hard native-level crash with no Python traceback
        # at all -- two different failure signatures observed, both from the
        # same code path). Confirmed NOT dependent on clicking elsewhere --
        # reproduced once with zero user interaction for 50s after the
        # switch. Disabling this only drops the cosmetic slide/circle/
        # diamond transition effect -- WallpaperManager.set_wallpaper()
        # falls through to the real IDesktopWallpaper COM call either way,
        # so clicking a wallpaper still actually changes it and still
        # regenerates the palette (run_after still fires). See
        # claude/winarchy-decoupling-plan.md, YASB section.
        enabled: false
        animation: "slide_top" # circle/slide_top/diamond/split -- unused while disabled
      gallery:
        image_width: 520
        image_corner_radius: 6
        type: "magnified" # default/magnified/strip/slide - see "Gallery types" below
        orientation: "landscape" # landscape/portrait
        accent_color: "auto"
      callbacks:
        on_left: "toggle_gallery"
        on_middle: "do_nothing"
        on_right: "change_wallpaper"
      keybindings:
        - keys: "ctrl+alt+w"
          action: "toggle_gallery"
          screen: "primary" # active/cursor/primary
      # Regenerates the whole palette (komorebi borders, YASB colors, Windows
      # Terminal scheme, Windows accent) from whichever wallpaper was just picked.
      # wallust's own [hooks] is broken on this alpha build (see config/wallust/
      # wallust.toml), so the apply script is chained here directly instead of
      # relying on wallust to call it.
      run_after:
        - "C:\\710.DesktopRice\\tools\\bin\\wallust\\wallust.exe run {image} --config-dir C:\\710.DesktopRice\\config\\wallust"
        - "pwsh -NoProfile -File C:\\710.DesktopRice\\tools\\apply-wallust-outputs.ps1"
  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uf4bc</span> {info[percent][total]}%"
      label_alt: "<span>\uf437</span> {info[freq][current]} MHz"
      update_interval: 2000
      cpu_thresholds:
        low: 25
        medium: 50
        high: 90
      histogram_icons:
        - "\u2581" # 0%
        - "\u2581" # 10%
        - "\u2582" # 20%
        - "\u2583" # 30%
        - "\u2584" # 40%
        - "\u2585" # 50%
        - "\u2586" # 60%
        - "\u2587" # 70%
        - "\u2588" # 80%+
      histogram_num_columns: 8
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        round_corners: true
        border_color: None
        blur: false
  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\uf4bc</span> {virtual_mem_used}/{virtual_mem_total}"
      label_alt: "<span>\uf4bc</span> VIRT: {virtual_mem_percent}% SWAP: {swap_mem_percent}%"
      update_interval: 5000
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"
      memory_thresholds:
        low: 25
        medium: 50
        high: 90
      histogram_icons:
        - "\u2581" # 0%
        - "\u2581" # 10%
        - "\u2582" # 20%
        - "\u2583" # 30%
        - "\u2584" # 40%
        - "\u2585" # 50%
        - "\u2586" # 60%
        - "\u2587" # 70%
        - "\u2588" # 80%+
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        round_corners: true
        border_color: None
        blur: false
  systeminfo-grouper:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "systeminfo-grouper"
      widgets: [
        "memory",
        "cpu",
        "gpu",
        "disk",
      ]
      collapse_options:
        enabled: true
        expanded_label: "\uf054"
        collapsed_label: "\ueaf8"
        label_position: "right"
  control_center:
    type: "yasb.control_center.ControlCenterWidget"
    options:
      label: "<span>\ueaf8</span>"
      tooltip: true
      sections_order:
        - "system_controls"
        - "quick_actions"
        - "sliders"
        - "power"
        - "media"
      popup:
        alignment: "right"
        direction: "down"
        border_color: none
        round_corners: false
        blur: false
        round_corners_type: normal
        offset_top: 9
        offset_left: 5
      sections:
        system_controls:
          profile_image_size: 28
          power_icon: "\uE7E8"
          lock_icon: "\uE72E"
          settings_icon: "\uE713"
        quick_actions:
          show: true
          columns: 3
          label_position: "default"
          actions:
            - id: "toggle_dnd"
              label: "Do Not Disturb"
              icon: "\uf285"
            - id: "toggle_mute"
              label: "Mute"
              icon: "\ue74f"
            - id: "toggle_mic_mute"
              label: "Mic Mute"
              icon: "\uF12E"
            - id: "screenshot"
              label: "Screenshot"
              icon: "\ue91b"
            - id: "touch_keyboard"
              label: "Keyboard"
              icon: "\uE765"
            - id: "toggle_theme"
              label: "Dark Mode"
              icon: "\uE708"
        sliders:
          show: true
          brightness:
            show_slider: true
            icon: "\uE706"
            show_source_selector: true
            source_selector_icon: "\uE972"
          volume:
            show_slider: true
            icon: "\uE767"
            show_source_selector: true
            source_selector_icon: "\uE972"
          microphone:
            show_slider: true
            icon: "\uE720"
            show_source_selector: true
            source_selector_icon: "\uE972"
        media:
          show: true
          thumbnail_size: 36
          thumbnail_radius: 4
          icons:
            prev_track: "\ue622"
            next_track: "\ue623"
            play: "\uf5b0"
            pause: "\ue62e"
        power:
          show: false # crashes on this machine - see plan doc YASB section
          power_plan_title: "Power Plan"
          power_mode_title: "Power Mode"
          button_menu_icon: "\ue76c"
      callbacks:
        on_left: "toggle_menu"
  gpu:
    type: "yasb.gpu.GpuWidget"
    options:
      label: "<span>\uf4bc</span> {info[utilization]}%"
      label_alt: "<span>\uf4bc</span> {info[temp]}°C | {info[mem_used]} / {info[mem_total]}"
      gpu_index: 0
      update_interval: 2000
      hide_decimal: false
      units: "metric"
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_menu"
      menu:
        enabled: true
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: None
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
  disk:
    type: "yasb.disk.DiskWidget"
    options:
      label: "<span>\uf4bc</span> {volume_label} {space[used][percent]}"
      label_alt: "<span>\uf4bc</span> {volume_label} {space[used][gb]} / {space[total][gb]}"
      volume_label: "C"
      decimal_display: 1
      update_interval: 60
      group_label:
        volume_labels: ["C"] # add more drive letters here if Dell/future machines have them
        show_label_name: true
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: None
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
      callbacks:
        on_left: "toggle_group"
        on_middle: "toggle_label"
        on_right: "exec explorer C:\\"
  weather:
    type: "yasb.weather.WeatherWidget"
    options:
      label: "<span>{icon}</span> {temp}"
      label_alt: "{location}: Min {min_temp}, Max {max_temp}, Humidity {humidity}"
      api_key: "$env:YASB_WEATHER_API_KEY" # set via `setx YASB_WEATHER_API_KEY "..."` on each machine - never commit the real key
      show_alerts: true
      tooltip: true
      update_interval: 600
      hide_decimal: true
      units: "imperial" # °F
      location: "00000" # [town removed] - zip is the most unambiguous query for weatherapi.com
      callbacks:
        on_left: "toggle_card"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      weather_card:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: System
        alignment: "center"
        direction: "down"
        icon_size: 64
        show_hourly_forecast: true
        time_format: "24h"
        hourly_point_spacing: 76
        hourly_icon_size: 32
        icon_smoothing: true
        temp_line_width: 2
        hourly_forecast_buttons:
          enabled: true
          default_view: "temperature"
