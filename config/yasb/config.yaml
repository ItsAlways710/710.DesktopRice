# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json
# For more information, visit https://github.com/amnweb/yasb/wiki
# watch_config stays FALSE on purpose (confirmed from YASB's own source,
# core/bar_manager.py: on_config_modified): a config.yaml change on disk triggers a full
# reload_application() process restart, which is the path that produced the "connects
# fine, never renders, CPU creeps up" komorebi-pipe-subscription bug we spent a night
# chasing (ported this off from winarchy's own config, which documents the same issue).
# watch_stylesheet is safe and back ON: confirmed from source (core/watcher.py /
# on_styles_modified) that a stylesheet change -- including an imported file like
# wallust_colors.css -- only calls bar.setStyleSheet() on the already-built bars. It
# never touches widgets, listeners, or komorebi at all, so it can't reintroduce the
# widget bug. This is what makes wallpaper-driven color changes show up on the YASB bar
# live again, without needing a manual reload.
watch_stylesheet: true
watch_config: false
system_colors: false
debug: false
# YASB's own update check and tray icon off (winarchy did both; ported 2026-10-01). YASB is pinned
# in versions.md and `710sRice update` moves it -- its own "new version" prompt would offer one we
# haven't tried. Its tray icon (Reload / Exit) isn't needed: 710sRice restart and SUPER+Ctrl+R
# restart the bar. The bar's systray widget below is a different thing and stays.
update_check: false
show_systray: false
bars:
  primary-bar:
    enabled: true
    style: "adaptive"
    style_adaptive_exclude: ["wallpapers", "systray"]
    screens:
    - '*'
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: false
      round_corners: true
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 35
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      # No separator between the window title and the capture drawer: the title hides itself on
      # the desktop (YASB ignores the desktop window), and a `lines` on each side of it then stood
      # side by side -- "4 | |" (the Dell's final test, 2026-10-01). Widget padding spaces them.
      left:
      - home
      - lines
      - screens
      - lines
      - komorebi_active_layout
      - lines
      - komorebi_workspaces
      - lines
      - active_window
      - capture-drawer
      center:
      - clock
      - weather
      - taskbar-drawer
      right:
      - systray
      - lines
      - systeminfo-grouper
      - lines
      - network-grouper
      - battery
      - lines
      - wallpapers
      - lines
      - notifications
      - control_center
widgets:
  home:
    type: yasb.home.HomeWidget
    options:
      label: "<span>家</span>"
      # system_menu is off and its three items (About this PC / System Settings / Task
      # Manager) are rebuilt here with YASB's own actions (winver, ms-settings:, taskmgr),
      # because YASB always draws the system section ABOVE menu_list -- and "Main Menu"
      # goes first. Main Menu = the SUPER+Alt+Space palette: YASB runs
      # config\ahk\open-main-menu.ahk, which asks the running 710.ahk to open it.
      menu_list:
      - title: Main Menu
        command: 'C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe'
        args: ['$env:DESKTOPRICE_HOME\config\ahk\open-main-menu.ahk']
      - { separator: true }
      - title: About this PC
        command: winver
      - { separator: true }
      - title: System Settings
        uri: 'ms-settings:'
      - title: Task Manager
        command: taskmgr
      - { separator: true }
      - title: User Home
        path: '~'
      - title: Download
        path: ~\Downloads
      - title: Documents
        path: ~\Documents
      - title: Pictures
        path: ~\Pictures
      - title: Wallpapers
        path: $env:DESKTOPRICE_HOME\assets\wallpapers
      system_menu: false
      power_menu: false
      blur: false
      round_corners: true
      round_corners_type: normal
      border_color: System
      alignment: left
      offset_left: -5
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%H:%M | %a, %b %d}<span>{alarm}</span>'
      label_alt: '{%H:%M | %a, %b %d}'
      timezones: []
      calendar:
        blur: false
        round_corners: true
        alignment: center
        offset_left: 110
        direction: down
        extended: false
        show_years: true
        show_holidays: true
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "<span>\udb80\udc9e</span>"
      label_alt: '{count} notifications'
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: toggle_notification
        on_right: do_nothing
        on_middle: do_nothing
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: "<span>\udb80\udc09</span>"
      uptime: true
      show_user: true
      menu_style: popup
      popup:
        blur: false
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        offset_left: 12
      profile_image_size: 64
      buttons:
        lock:
        - "\uDB80\uDF41"
        - Lock
        signout:
        - "\uDB80\uDF43"
        - Sign out
        sleep:
        - "\uDB82\uDD04"
        - Sleep
        hibernate:
        - "\uDB82\uDD01"
        - Hibernate
        restart:
        - "\uDB81\uDC53"
        - Restart
        shutdown:
        - "\uDB82\uDD06"
        - Shut Down
        cancel:
        - ''
        - Cancel
  active_window:
    type: yasb.active_window.ActiveWindowWidget
    options:
      label: '{win[title]}'
      label_alt: '{win[title]}'
      label_no_window: ''
      label_icon: true
      label_icon_size: 16
      max_length: 32
      max_length_ellipsis: '...'
      monitor_exclusive: false
  # The taskbar drawer (2026-10-05): YASB's own Taskbar widget, folded into the center
  # island after the weather. It starts closed, so the bar is no wider until you open it. Each
  # bar lists only its own screen's windows on the workspace showing now; pins show on every
  # bar. Pins are per machine (right-click an app's icon > Pin to taskbar): YASB keeps them in
  # %LOCALAPPDATA%\YASB\taskbar_pinned.json, so none ship with the repo. Icons only -- the
  # active_window title on the left already says which window has focus.
  # The Screens button (2026-10-05): the monitor icon right after the home menu. It asks 710.ahk
  # for its Screens menu (send-command.ahk screens), which drops down under the mouse. No shell:
  # AutoHotkey is a GUI program, so nothing flashes.
  screens:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span>\udb80\udf7a</span>"
      class_name: "screens-widget"
      tooltip: true
      tooltip_label: "Screens"
      exec_options:
        use_shell: false
      callbacks:
        on_left: 'exec "$env:ProgramFiles\AutoHotkey\v2\AutoHotkey64.exe" "$env:DESKTOPRICE_HOME\config\ahk\send-command.ahk" screens'
        on_middle: "do_nothing"
        on_right: "do_nothing"
  taskbar-drawer:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "taskbar-drawer"
      widgets: ["taskbar"]
      collapse_options:
        enabled: true
        label_position: "left"
        collapsed_label: ""
        expanded_label: ""
  taskbar:
    type: "yasb.taskbar.TaskbarWidget"
    options:
      icon_size: 16
      tooltip: true
      monitor_exclusive: true
      show_only_visible: true
      title_label:
        enabled: false
      grouping:
        enabled: true
        show_count: true
      preview:
        enabled: false
  lines:
    type: "yasb.custom.CustomWidget"
    options:
      label: "\u007c"
      label_alt: "\u007c"
      class_name: "separator-widget"
      callbacks:
        on_left: "do_nothing"
  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "Komorebi Offline"
      label_workspace_btn: "{index}"
      label_workspace_active_btn: "{index}"
      label_workspace_populated_btn: "{index}"
      label_default_name: ""
      label_zero_index: false
      # true (Group 1 #7, 2026-09-30): each bar shows its own screen's current workspace plus
      # any workspace with windows. YASB 2.0.7 reads each screen's own focused workspace
      # (client.py) and hides a button only when it's empty AND not that screen's focused one
      # (workspaces.py). The 2026-09-21 "false, permanently" (3330cff) came from "shows nothing
      # on a secondary monitor", seen while four other causes were broken and fixed together.
      hide_empty_workspaces: true
      hide_if_offline: true
      toggle_workspace_layer:
        enabled: false
        tiling_label: "Tiling"
        floating_label: "Floating"
      app_icons: 
        enabled_populated: false
        enabled_active: false
        size: 12
        max_icons: 0
        hide_label: false
        hide_duplicates: false
        hide_floating: false
  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "{layout_name}"
      layouts: ['bsp', 'columns', 'rows', 'grid', 'scrolling', 'vertical_stack', 'horizontal_stack', 'ultrawide_vertical_stack','right_main_vertical_stack']
      layout_icons:
        bsp: "\uebeb"
        columns: "\uebf7"
        rows: "\uec01"
        grid: "\udb81\udf58"
        scrolling: "\uebf7"
        vertical_stack: "\uebee"
        horizontal_stack: "\uebf0"
        ultrawide_vertical_stack: "\uebee"
        right_main_vertical_stack: "\uebf1"
        monocle: "\uf06f"
        maximized: "\uf06f"
        floating: "\uf2d2"
        paused: "\udb83\udf89"
        tiling: "\udb81\ude40"
      callbacks:
        on_left: 'toggle_layout_menu'
        on_middle: 'next_layout'
        on_right: 'prev_layout'
      layout_menu:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "left"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_layout_icons: true
  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "\uf107"
      label_expanded: "\uf106"
      label_position: "left" # Can be "left" or "right"
      icon_size: 16 # Can be any integer between 8 and 64
      pin_click_modifier: "alt" # Can be "ctrl", "alt" or "shift"
      show_unpinned: false
      show_unpinned_button: true
      show_battery: false
      show_in_popup: 1
      show_volume: false
      icons_per_row: 3
      # Windows' own network, battery and volume icons stay out of this tray: network and
      # battery have their own widgets in the bar (network-grouper, battery -- winarchy port,
      # 2026-10-01), volume is in the control center.
      show_network: false
      use_hook: false # Whether to use the new systray hook instead of the legacy systray monitor
      # ShareX's icon: ShareX keeps its own tray icon ON -- it honours -silent (the sign-in
      # task's "no window") only with it -- so the bar hides it instead (Group 1 W4; YASB
      # matches an icon's exe name up to its first dot, case-insensitively).
      hide_icons: ["ShareX"] # process names to hide
      popup:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: None
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span>\udb83\udc8d</span>"
      change_automatically: false
    # Scans these folders (and their subfolders) for wallpapers: the repo's own
    # small tracked default set, and up to ten personal folders that never touch
    # git -- see claude/winarchy-decoupling-plan.md, Wallpapers section. All go
    # through YASB's own $env: expansion (applied to every config string before
    # validation; the name is matched whole, so _2 is its own variable):
    # DESKTOPRICE_HOME is the repo root, set by install.ps1, so the repo can be
    # cloned anywhere; YASB_WALLPAPER_PATH and _2 .. _10 are yours to set
    # (`setx YASB_WALLPAPER_PATH_2 "D:\wherever"`, then `710sRice reload bar`)
    # -- an unset one expands to "" and YASB silently skips it, nothing breaks.
    # Ten slots so nobody has to edit this tracked file (that blocks `git pull`
    # and `710sRice update`) just to add a folder.
      image_path:
        - "$env:DESKTOPRICE_HOME\\assets\\wallpapers"
        - "$env:YASB_WALLPAPER_PATH"
        - "$env:YASB_WALLPAPER_PATH_2"
        - "$env:YASB_WALLPAPER_PATH_3"
        - "$env:YASB_WALLPAPER_PATH_4"
        - "$env:YASB_WALLPAPER_PATH_5"
        - "$env:YASB_WALLPAPER_PATH_6"
        - "$env:YASB_WALLPAPER_PATH_7"
        - "$env:YASB_WALLPAPER_PATH_8"
        - "$env:YASB_WALLPAPER_PATH_9"
        - "$env:YASB_WALLPAPER_PATH_10"
      engine:
        # Disabled -- YASB's WallpaperEngine crossfade transition has a real,
        # reproducible bug: it crashes the whole YASB process some time after
        # a wallpaper switch (AttributeError: no attribute '_progress' in
        # paintEvent, or a hard native-level crash with no Python traceback
        # at all -- two different failure signatures observed, both from the
        # same code path). Confirmed NOT dependent on clicking elsewhere --
        # reproduced once with zero user interaction for 50s after the
        # switch. Disabling this only drops the cosmetic slide/circle/
        # diamond transition effect -- WallpaperManager.set_wallpaper()
        # falls through to the real IDesktopWallpaper COM call either way,
        # so clicking a wallpaper still actually changes it and still
        # regenerates the palette (run_after still fires). See
        # claude/winarchy-decoupling-plan.md, YASB section.
        enabled: false
        animation: "slide_top" # circle/slide_top/diamond/split -- unused while disabled
      gallery:
        image_width: 520
        image_corner_radius: 6
        type: "magnified" # default/magnified/strip/slide - see "Gallery types" below
        orientation: "landscape" # landscape/portrait
        accent_color: "auto"
      callbacks:
        on_left: "toggle_gallery"
        on_middle: "do_nothing"
        on_right: "change_wallpaper"
      keybindings:
        - keys: "ctrl+alt+w"
          action: "toggle_gallery"
          screen: "primary" # active/cursor/primary
      # Re-themes everything (bar, menus, prompt, Flow, komorebi borders, Windows
      # accent, Windows Terminal) from whichever wallpaper was just picked, with the
      # chosen palette profile (SUPER+Alt+Space > Palette profiles). One line: the
      # profile decides how wallust makes the palette, which static text here can't
      # (this was two lines -- wallust, then the apply script -- until Palette Profiles).
      # wallust's own [hooks] is broken on this alpha build (see
      # config/wallust/wallust.template.toml), so the pipeline is chained here.
      run_after:
      # Run through cmd (YASB: subprocess shell=True, {image} arrives quoted), so the
      # repo path is quoted too -- a clone under a path with spaces still works.
        - 'pwsh -NoProfile -File "$env:DESKTOPRICE_HOME\tools\apply-wallust-outputs.ps1" -Image {image}'
  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uf4bc</span> {info[percent][total]}%"
      label_alt: "<span>\uf437</span> {info[freq][current]} MHz"
      update_interval: 2000
      cpu_thresholds:
        low: 25
        medium: 50
        high: 90
      histogram_icons:
        - "\u2581" # 0%
        - "\u2581" # 10%
        - "\u2582" # 20%
        - "\u2583" # 30%
        - "\u2584" # 40%
        - "\u2585" # 50%
        - "\u2586" # 60%
        - "\u2587" # 70%
        - "\u2588" # 80%+
      histogram_num_columns: 8
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        round_corners: true
        border_color: None
        blur: false
  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\uf4bc</span> {virtual_mem_used}/{virtual_mem_total}"
      label_alt: "<span>\uf4bc</span> VIRT: {virtual_mem_percent}% SWAP: {swap_mem_percent}%"
      update_interval: 5000
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"
      memory_thresholds:
        low: 25
        medium: 50
        high: 90
      histogram_icons:
        - "\u2581" # 0%
        - "\u2581" # 10%
        - "\u2582" # 20%
        - "\u2583" # 30%
        - "\u2584" # 40%
        - "\u2585" # 50%
        - "\u2586" # 60%
        - "\u2587" # 70%
        - "\u2588" # 80%+
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        round_corners: true
        border_color: None
        blur: false
  systeminfo-grouper:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "systeminfo-grouper"
      widgets: [
        "memory",
        "cpu",
        "gpu",
        "disk",
      ]
      collapse_options:
        enabled: true
        expanded_label: "\uf054"
        collapsed_label: "\ueaf8"
        label_position: "right"
  control_center:
    type: "yasb.control_center.ControlCenterWidget"
    options:
      label: "<span>\ueaf8</span>"
      tooltip: true
      sections_order:
        - "system_controls"
        - "quick_actions"
        - "sliders"
        - "power"
        - "media"
      popup:
        alignment: "right"
        direction: "down"
        border_color: none
        round_corners: false
        blur: false
        round_corners_type: normal
        offset_top: 9
        offset_left: 5
      sections:
        system_controls:
          profile_image_size: 28
          power_icon: "\uE7E8"
          lock_icon: "\uE72E"
          settings_icon: "\uE713"
        quick_actions:
          show: true
          columns: 3
          label_position: "default"
          actions:
            - id: "toggle_dnd"
              label: "Do Not Disturb"
              icon: "\uf285"
            - id: "toggle_mute"
              label: "Mute"
              icon: "\ue74f"
            - id: "toggle_mic_mute"
              label: "Mic Mute"
              icon: "\uF12E"
            - id: "screenshot"
              label: "Screenshot"
              icon: "\ue91b"
            - id: "touch_keyboard"
              label: "Keyboard"
              icon: "\uE765"
            - id: "toggle_theme"
              label: "Dark Mode"
              icon: "\uE708"
        sliders:
          show: true
          brightness:
            show_slider: true
            icon: "\uE706"
            show_source_selector: true
            source_selector_icon: "\uE972"
          volume:
            show_slider: true
            icon: "\uE767"
            show_source_selector: true
            source_selector_icon: "\uE972"
          microphone:
            show_slider: true
            icon: "\uE720"
            show_source_selector: true
            source_selector_icon: "\uE972"
        media:
          show: true
          thumbnail_size: 36
          thumbnail_radius: 4
          icons:
            prev_track: "\ue622"
            next_track: "\ue623"
            play: "\uf5b0"
            pause: "\ue62e"
        power:
          show: false # crashes on this machine - see plan doc YASB section
          power_plan_title: "Power Plan"
          power_mode_title: "Power Mode"
          button_menu_icon: "\ue76c"
      callbacks:
        on_left: "toggle_menu"
  # --- Network and battery (winarchy port audit, 2026-10-01) -------------------------------------
  # Wi-Fi and Bluetooth in one group, folded behind its button like the system-info group; the
  # battery next to it, always shown.
  # Bluetooth: "bluetooth$env:DESKTOPRICE_NO_BLUETOOTH" is 'bluetooth' (YASB's icon -- dimmed while
  # the radio is off) on a machine with an adapter and 'bluetooth_none' (an empty widget) on one
  # without: scripts\Start-Yasb.ps1 sets the variable from the hardware at every bar start
  # (tools\lib\bluetooth.ps1), and the install's bluetooth step registers it for a YASB started any
  # other way. YASB 2.0.7's own widget can't tell "no adapter" from "off" (both are its bt-off),
  # and a name here that isn't defined pops an error dialog -- so the name is always one of the two.
  network-grouper:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "network-grouper"
      widgets: ["wifi", "bluetooth$env:DESKTOPRICE_NO_BLUETOOTH"]
      collapse_options:
        enabled: true
        label_position: "left"
        collapsed_label: "\udb80\udc02"
        expanded_label: "\uf054"
  # YASB's own Wi-Fi widget (the user's pick over winarchy's net-icon script). Click: its network
  # list; right-click: the network's name (Ethernet: the IP address); middle: Windows' network page.
  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "<span>{wifi_icon}</span> {wifi_name}"
      ethernet_label: "<span>{wifi_icon}</span>"
      ethernet_label_alt: "<span>{wifi_icon}</span> {ip_addr}"
      ethernet_icon: "\udb80\ude00"
      update_interval: 5000
      callbacks:
        on_left: "toggle_menu"
        on_middle: "exec explorer.exe ms-settings:network"
        on_right: "toggle_label"
      menu_config:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
  # Click: its device list (and the on/off switch); right-click: what's connected; middle:
  # Windows' Bluetooth page.
  bluetooth:
    type: "yasb.bluetooth.BluetoothWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span> {device_name}"
      icons:
        bluetooth_on: "\udb80\udcaf"
        bluetooth_off: "\udb80\udcb2"
        bluetooth_connected: "\udb80\udcb1"
      callbacks:
        on_left: "toggle_menu"
        on_middle: "exec explorer.exe ms-settings:bluetooth"
        on_right: "toggle_label"
      menu_config:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
  # A machine with no Bluetooth adapter: nothing at all in the group's second place.
  bluetooth_none:
    type: "yasb.custom.CustomWidget"
    options:
      label: ""
      class_name: "bluetooth-none"
      callbacks:
        on_left: "do_nothing"
        on_middle: "do_nothing"
        on_right: "do_nothing"
  # hide_unsupported: a machine with no battery shows nothing (winarchy's, as it was). Click: the
  # percentage.
  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span> {percent}%"
      hide_unsupported: true
      update_interval: 10000
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_label"
  # --- The capture drawer (winarchy port audit, 2026-10-01) --------------------------------------
  # After the window title, folded behind its arrow: six ShareX buttons, each calling ShareX
  # directly with its own command-line action (the ones 710.ahk's Capture menu uses). ShareX is
  # where winget puts it ($env:ProgramFiles -- YASB expands it, as everywhere here). The power-plan
  # button that sat at its end came out on the Dell test (2026-10-01: the user didn't want it there).
  capture-drawer:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "capture-drawer"
      widgets: ["capture_region", "capture_record", "capture_stop", "capture_ocr", "capture_qr", "capture_color"]
      collapse_options:
        enabled: true
        label_position: "left"
        collapsed_label: "\uf054"
        expanded_label: "\uf053"
  capture_region:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span>\udb80\udd9e</span>"
      class_name: "capture-widget"
      tooltip: true
      tooltip_label: "Region capture"
      callbacks:
        on_left: 'exec "$env:ProgramFiles\ShareX\ShareX.exe" -RectangleRegion'
        on_middle: "do_nothing"
        on_right: "do_nothing"
  capture_record:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span>\udb81\udc4a</span>"
      class_name: "capture-widget"
      tooltip: true
      tooltip_label: "Screen recording"
      callbacks:
        on_left: 'exec "$env:ProgramFiles\ShareX\ShareX.exe" -ScreenRecorder'
        on_middle: "do_nothing"
        on_right: "do_nothing"
  capture_stop:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span>\udb81\udcdb</span>"
      class_name: "capture-widget"
      tooltip: true
      tooltip_label: "Stop recording"
      callbacks:
        on_left: 'exec "$env:ProgramFiles\ShareX\ShareX.exe" -StopScreenRecording'
        on_middle: "do_nothing"
        on_right: "do_nothing"
  capture_ocr:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span>\udb84\udd3a</span>"
      class_name: "capture-widget"
      tooltip: true
      tooltip_label: "Text from screen (OCR)"
      callbacks:
        on_left: 'exec "$env:ProgramFiles\ShareX\ShareX.exe" -OCR'
        on_middle: "do_nothing"
        on_right: "do_nothing"
  capture_qr:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span>\udb81\udc33</span>"
      class_name: "capture-widget"
      tooltip: true
      tooltip_label: "Scan a QR code on screen"
      callbacks:
        on_left: 'exec "$env:ProgramFiles\ShareX\ShareX.exe" -QRCodeScanRegion'
        on_middle: "do_nothing"
        on_right: "do_nothing"
  capture_color:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span>\udb80\ude0a</span>"
      class_name: "capture-widget"
      tooltip: true
      tooltip_label: "Colour picker"
      callbacks:
        on_left: 'exec "$env:ProgramFiles\ShareX\ShareX.exe" -ScreenColorPicker'
        on_middle: "do_nothing"
        on_right: "do_nothing"
  gpu:
    type: "yasb.gpu.GpuWidget"
    options:
      label: "<span>\uf4bc</span> {info[utilization]}%"
      label_alt: "<span>\uf4bc</span> {info[temp]}°C | {info[mem_used]} / {info[mem_total]}"
      gpu_index: 0
      update_interval: 2000
      hide_decimal: false
      units: "metric"
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_menu"
      menu:
        enabled: true
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: None
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
  disk:
    type: "yasb.disk.DiskWidget"
    options:
      label: "<span>\uf4bc</span> {volume_label} {space[used][percent]}"
      label_alt: "<span>\uf4bc</span> {volume_label} {space[used][gb]} / {space[total][gb]}"
      volume_label: "C"
      decimal_display: 1
      update_interval: 60
      group_label:
        volume_labels: ["C"] # add more drive letters here if Dell/future machines have them
        show_label_name: true
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: None
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
      callbacks:
        on_left: "toggle_group"
        on_middle: "toggle_label"
        on_right: "exec explorer C:\\"
  # Open-Meteo (Group 1 #1): no account, no key. Click the widget and search for your city the
  # first time; YASB keeps it in %LOCALAPPDATA%\YASB\weather.json under this widget's name
  # ("weather" -- renaming the widget forgets the city), shared by every bar on every monitor.
  # Clicking the city on the card picks a new one. (Was yasb.weather.WeatherWidget, which needed
  # a weatherapi.com key; its alerts have no Open-Meteo equivalent.)
  weather:
    type: "yasb.open_meteo.OpenMeteoWidget"
    options:
      label: "<span>{icon}</span> {temp}"
      label_alt: "{location}: Min {min_temp}, Max {max_temp}, Humidity {humidity}"
      tooltip: true
      update_interval: 600
      hide_decimal: true
      units: "imperial" # °F
      callbacks:
        on_left: "toggle_card"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      weather_card:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: System
        alignment: "center"
        direction: "down"
        icon_size: 64
        show_hourly_forecast: true
        time_format: "24h"
        hourly_point_spacing: 76
        hourly_icon_size: 32
        icon_smoothing: true
        temp_line_width: 2
        hourly_forecast_buttons:
          enabled: true
          default_view: "temperature"
