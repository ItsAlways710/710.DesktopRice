# The komorebi rules this repo ships -- above games.toml and the vendored community
# ASC rules, below your own rules.local.toml (Quick add's file, this machine only).
# Compiled into komorebi.json by tools\compile-komorebi-rules.ps1 (run by
# SUPER+Shift+R). Tracked in git on purpose, so rules follow you to every machine.
# Sections: [[floating]], [[ignore]], [[manage]], ... with one of exe / class /
# title per entry. Not [[game]] (shipped games go in games.toml) or [[pin]] (a pin
# names this machine's screens -- rules.local.toml only).

# WinUI 3 apps (new Photos, and others built on the same framework) stop taking
# clicks when komorebi's transparency makes them translucent -- found with
# Photos 2026-09-24 (turning transparency off made its controls work again).
# Whole window class, not just Photos.exe, so the next WinUI 3 app doesn't need
# rediscovering. Cost: these stay opaque when unfocused.
[[transparency_ignore]]
class = "WinUIDesktopWin32WindowClass"

# Claude Desktop ships its main window with WS_EX_LAYERED already set, and
# komorebi turns away layered windows unless they're whitelisted -- so Claude
# floated unmanaged on every workspace. Caught 2026-09-25 in komorebi's log:
# its Hide events passed the eligibility check (Hide skips the layered test),
# its Show events never did. [[layered]] and NOT [[manage]], on purpose:
# a manage rule beats ignore rules, which tiled Claude's file picker (#26).
[[layered]]
exe = "claude.exe"

# Flow Launcher and ShareX: never tiled, moved or bordered (winarchy's own template
# had both). Without them ShareX's main window, image editor and settings tiled when
# they opened, and so did Flow's Settings window. [[ignore]] like winarchy's, not
# [[floating]] -- komorebi keeps its hands off entirely. (Flow's search box was
# never managed either way.)
[[ignore]]
exe = "Flow.Launcher.exe"

[[ignore]]
exe = "ShareX.exe"

# AutoHotkey's own main window -- class AutoHotkey, one per running script, normally hidden.
# (Script GUIs, 710.ahk's palette and dialogs among them, are AutoHotkeyGUI and stay as they are.)
# SUPER+Shift+R ends in 710.ahk's Reload(): AutoHotkey starts the new copy shown normally and
# hides its main window a moment later. komorebi sees that moment as a new window, and on an
# EMPTY workspace it focuses a new window -- which shows it again after AutoHotkey's hide, so
# a blank AutoHotkey window got tiled into a slot and sat on the taskbar (found 2026-10-06 on
# the Dell and Godzilla; Esc in it cleared it). Ignored, komorebi never touches it and the hide
# sticks: nothing tiled, nothing on the taskbar. The split-second flash of the reload stays.
[[ignore]]
class = "AutoHotkey"
