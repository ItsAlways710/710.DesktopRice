# wallust config -- makes the PALETTE, nothing else (Palette Profiles, 2026-09-27).
#
# THIS IS THE TEMPLATE. tools\write-wallust-config.ps1 (install's wallust step, and the wallpaper
# pipeline itself whenever it finds the real one out of date) writes config\wallust\wallust.toml
# from it with {{DESKTOPRICE_HOME}} replaced by wherever this repo lives -- wallust's template
# targets need absolute paths. The generated file is gitignored; edit this one.
#
# tools\apply-wallust-outputs.ps1 runs wallust with --config-dir config\wallust and -s: wallust
# never writes Windows Terminal or any themed file itself. Its ONE template (templates\
# palette.json.tpl) dumps every colour it made -- background, foreground, cursor, color0-15 --
# and the active palette profile decides where they go (tools\lib\palette.ps1,
# tools\palette\targets\). The profile also decides HOW the palette is made (wallust's method,
# style, saturation, 16 colours, or a built-in theme / scheme file) -- on the command line, which
# overrides the palette line below. kmeans is the Default profile's method, and what a bar started
# before Palette Profiles runs with its old first run_after line (harmless: it only writes the
# dump, which the pipeline makes again right after).
#
# [hooks] is NOT used -- broken on this pinned 4.1.0-alpha on Windows (it tries to run the hook's
# own KEY NAME as a program: "apply: Couldn't run 'apply': program not found", even for a trivial
# `apply = 'notepad.exe'`). YASB's run_after calls the pipeline instead.

palette = "kmeans"

[templates]
dump = { template = 'palette.json.tpl', target = '{{DESKTOPRICE_HOME}}\config\wallust\generated\palette.next.json' }
