# Games and launchers this rice knows about.
# Each entry produces: (a) an ignore-rule in komorebi (never tiled),
# (b) suspension of SUPER hotkeys while the process is in the foreground
#     (see the AHK game-mode watcher).
# `exe` is the process name without a path (with or without .exe).
#
# The entries below are winarchy's curated defaults, carried over as-is.
# Generic names that would match non-game apps (javaw.exe, hl2.exe,
# ShooterGame.exe) are deliberately avoided. An exe that never matches a
# running process is harmless — it just never fires.

# --- Launchers and non-game windows that also shouldn't be tiled ------------
[[launchers]]
exe = "steam.exe"

[[launchers]]
exe = "steamwebhelper.exe"

[[launchers]]
exe = "EpicGamesLauncher.exe"

[[launchers]]
exe = "GalaxyClient.exe"

[[launchers]]
exe = "Riot Client.exe"

[[launchers]]
exe = "Battle.net.exe"

[[launchers]]
exe = "EADesktop.exe"

[[launchers]]
exe = "upc.exe"                       # Ubisoft Connect

[[launchers]]
exe = "rustdesk.exe"                  # remote desktop session — shouldn't be tiled

